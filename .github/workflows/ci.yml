name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit

  unit:
    name: vitest (server-side contracts)
    runs-on: ubuntu-latest
    needs: check
    env:
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a fresh dev.db
        run: pnpm prisma migrate deploy
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Run vitest
        run: pnpm test:run

  e2e:
    name: playwright (hydration smoke)
    runs-on: ubuntu-latest
    needs: check
    env:
      DATABASE_URL: file:./prisma/dev.db
      AUTH_SECRET: ci-test-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm prisma migrate deploy
      - name: Generate Prisma client
        run: pnpm prisma generate

      # Official Playwright CI guidance (verified via Context7 against
      # playwright.dev/docs/ci): always run `install --with-deps` on
      # ubuntu-latest. --with-deps fetches OS packages that headless
      # Chromium needs to start; skipping it can cause flaky launches
      # on minor runner image changes. We don't cache the browser
      # binary — the ~15s download is cheaper than the cache-key
      # bookkeeping needed to keep system-deps + binary in sync.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer config in playwright.config.ts boots
      # `pnpm dev` automatically and waits for it.
      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
